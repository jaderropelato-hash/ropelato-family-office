<style>
:root{--bg:#f5f6f8;--cd:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e6e8ee;--pr:#111827;--onpr:#fff;--ok:#059669;--er:#dc2626;--wa:#d97706;--gold:#c8963e;--sh:0 1px 2px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f17;--cd:#121826;--tx:#e7ebf3;--mu:#8b97ad;--bd:#1f2a3d;--pr:#e2b25e;--onpr:#1a1405;--ok:#34d399;--er:#fb7185;--wa:#fbbf24;--gold:#e2b25e;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25)}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
#app{display:flex;min-height:100vh}
nav{width:224px;background:var(--cd);border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav a{display:block;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--mu);margin-bottom:2px}nav a:hover{background:var(--bg);color:var(--tx)}nav a.on{background:var(--pr);color:var(--onpr)}
main{flex:1;padding:26px 28px;max-width:1120px;min-width:0}
h2,h3{letter-spacing:-.01em;font-weight:700}h2{font-size:22px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}.grid .card{margin:0}
.grid b{display:block;font-size:22px;font-weight:700;margin:4px 0;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
small,.mu{color:var(--mu);font-size:12px}
.ok{color:var(--ok)}.er{color:var(--er)}.wa{color:var(--wa)}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
input,select,textarea,button{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--gold) 55%,transparent);border-color:var(--gold)}
button{cursor:pointer;font-weight:500}button:hover{border-color:var(--mu)}button.p{background:var(--pr);color:var(--onpr);border-color:var(--pr)}button.s{padding:5px 10px;font-size:13px;border-radius:9px}button:disabled{opacity:.5}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}.row:last-child{border-bottom:0}.row>div:first-child{flex:1;min-width:160px}
.r{text-align:right}.b{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;margin-left:8px;background:color-mix(in srgb,currentColor 13%,transparent)}
.b.paga,.b.recebida{color:var(--ok)}.b.vencida{color:var(--er)}.b.parcial,.b.pendente{color:var(--wa)}.b.prevista,.b.cancelada{color:var(--mu)}
.bar{height:8px;border-radius:99px;background:var(--pr);margin-top:4px}
.md{position:fixed;inset:0;background:#0009;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9;overflow:auto}
.md form{width:100%;max-width:440px;max-height:95vh;overflow:auto;margin:0}.md label{display:block;margin:10px 0;font-size:13px;color:var(--mu)}.md input,.md select,.md textarea{width:100%;display:block;margin-top:4px;color:var(--tx)}
.ac{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ok);color:#fff;padding:11px 16px;border-radius:12px;z-index:99;max-width:90vw;box-shadow:var(--sh)}#t.e{background:var(--er)}
.lg{max-width:380px;margin:10vh auto;padding:16px}.lg input{width:100%;margin:6px 0}.lg h2{text-align:center}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 18px}.brand img{width:40px;height:38px;object-fit:contain;background:#fffdf9;border:1px solid var(--bd);border-radius:11px;padding:3px}.brand b{display:block;letter-spacing:.16em;font-size:14px;font-weight:800;line-height:1.1}.brand small{letter-spacing:.32em;font-size:8.5px}
.lb{background:#fffdf9;border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin-bottom:14px}.lb img{display:block;width:100%;max-width:280px;margin:0 auto}.hero{max-width:340px;margin:0 auto 6px}
.mtop{display:none}
@media(max-width:760px){#app{display:block}nav{position:fixed;bottom:0;top:auto;left:0;width:100%;height:auto;display:flex;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5;border-top:1px solid var(--bd);border-right:0;background:color-mix(in srgb,var(--cd) 90%,transparent);backdrop-filter:blur(14px);overflow-x:auto}
nav .brand,nav .off,nav .x{display:none}nav a{flex:1;min-width:64px;text-align:center;font-size:12px;padding:9px 4px;margin:0}main{padding:16px 14px 96px;padding-top:calc(16px + env(safe-area-inset-top))}.mtop{display:flex;margin-bottom:12px}}
.alerta{border:2px solid var(--er);background:color-mix(in srgb,var(--er) 7%,var(--cd))}
#jrf{position:fixed;left:224px;top:0;right:0;bottom:0;width:calc(100% - 224px);height:100%;border:0;background:#fff;z-index:4;display:none}@media(max-width:760px){#jrf{left:0;width:100%;height:calc(100% - 64px - env(safe-area-inset-bottom))}}
</style></head><body><div id="app"></div><div id="t" hidden></div>

// ===== CONEXÃO COM O SUPABASE =====
// Opção A (recomendada): preencha as duas linhas abaixo UMA vez antes de subir no GitHub; todos os aparelhos já abrem prontos.
// Opção B: deixe em branco; o app pede a URL e a chave na primeira abertura de cada aparelho.
const FIXO_URL='', FIXO_KEY='';
let SUPABASE_URL=FIXO_URL,SUPABASE_KEY=FIXO_KEY;
if(!SUPABASE_URL)try{const c=JSON.parse(localStorage.getItem('rfo_cfg')||'{}');SUPABASE_URL=c.u||'';SUPABASE_KEY=c.k||''}catch(e){}
const sb=SUPABASE_URL?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;window.FAMSB=sb;
function setup(){document.getElementById('app').innerHTML=`<div class="lg card">${lb()}<h2>Conectar ao Supabase</h2><p class="mu">Cole a URL do projeto e a chave <b>anon public</b> (Supabase › Project Settings › API). Nunca use a chave service_role. Fica guardado só neste aparelho.</p><input id="cu" placeholder="https://xxxx.supabase.co"><input id="ck" placeholder="Chave anon public"><button class="p" style="width:100%" id="cs">Salvar e entrar</button></div>`;cu.value=SUPABASE_URL;ck.value=SUPABASE_KEY;document.getElementById('cs').onclick=()=>{const u=cu.value.trim().replace(/\/+$/,''),kk=ck.value.trim();if(!/^https:\/\/[^\/]+\.supabase\.co$/.test(u)||kk.length<20)return toast('URL ou chave inválida',1);try{localStorage.setItem('rfo_cfg',JSON.stringify({u,k:kk}))}catch(e){return toast('Este navegador bloqueou o armazenamento local',1)}location.reload()}}
const hoje=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'});
const S={view:'geral',mes:hoje().slice(0,7),fm:hoje().slice(0,7),f:{q:'',st:'',cat:''},lim:50};
const ct=v=>Math.round(Number(v||0)*100),R=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),Rc=v=>R(v/100);
const D=s=>s?s.split('-').reverse().join('/'):'',x=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const iso=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function addD(s,n){const[a,b,c]=s.split('-').map(Number),t=new Date(Date.UTC(a,b-1,c+n));return iso(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())}
function addM(s,n){const[a,b,c]=s.split('-').map(Number),t=new Date(Date.UTC(a,b-1+n,1)),y=t.getUTCFullYear(),m=t.getUTCMonth()+1;return iso(y,m,Math.min(c,new Date(Date.UTC(y,m,0)).getUTCDate()))}
function toast(m,e){const t=document.getElementById('t');t.textContent=m;t.className=e?'e':'';t.hidden=false;clearTimeout(toast.T);toast.T=setTimeout(()=>t.hidden=true,e?6000:2500)}
async function ok(p,msg){const{error}=await p;if(error){toast('Não foi possível salvar: '+error.message,1);return false}toast(msg);return true}
const P=a=>a.map(v=>[v,v]);
async function all(t){let r=[],i=0;for(;;){const{data,error}=await sb.from(t).select('*').order('id').range(i,i+999);if(error)throw error;r=r.concat(data);if(data.length<1000)return r;i+=1000}}

function modal(t,fs,v,save){const d=document.createElement('div');d.className='md';d.innerHTML=`<form class="card"><h3>${t}</h3>${fs.map(f=>`<label>${f.l}${f.r?' *':''}${f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${x(o[0])}">${x(o[1])}</option>`).join('')}</select>`:f.t=='textarea'?`<textarea name="${f.k}" rows="2"></textarea>`:f.t=='checkbox'?`<input name="${f.k}" type="checkbox" style="width:auto">`:`<input name="${f.k}" type="${f.t||'text'}" ${f.dl?'list="'+f.dl+'"':''} ${f.t=='number'?(f.i?'step="1"':'step="0.01"')+' min="0"':''}>`}</label>`).join('')}<div class="ac"><button type="button">Cancelar</button><button class="p">Salvar</button></div></form>`;
const fm=d.querySelector('form');fs.forEach(f=>{const e=fm.elements[f.k],val=v[f.k]??f.d??'';if(f.t=='checkbox')e.checked=!!val;else e.value=val});
fm.querySelector('button[type=button]').onclick=()=>d.remove();let busy=0;
fm.onsubmit=async ev=>{ev.preventDefault();if(busy)return;const o={};for(const f of fs){const e=fm.elements[f.k];o[f.k]=f.t=='checkbox'?e.checked:e.value.trim();if(f.r&&o[f.k]===''){return toast('Preencha: '+f.l,1)}}
busy=1;const b=fm.querySelector('.p');b.disabled=true;const r=await save(o);busy=0;b.disabled=false;if(r){d.remove();refresh()}};document.body.appendChild(d)}
function baixar(nome,txt,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nome;a.click()}
function login(msg){document.getElementById('app').innerHTML=`<div class="lg card">${lb()}<p class="er">${x(msg||'')}</p><input id="e" type="email" placeholder="E-mail" autocomplete="username"><input id="s" type="password" placeholder="Senha" autocomplete="current-password"><button class="p" style="width:100%" id="go">Entrar</button><p><a href="#" id="rc">Esqueci a senha</a> · <a href="#" id="cf">Trocar conexão</a></p></div>`;
document.getElementById('go').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:e.value.trim(),password:s.value});if(error)login('E-mail ou senha inválidos.')};
document.getElementById('cf').onclick=ev=>{ev.preventDefault();setup()};document.getElementById('rc').onclick=async ev=>{ev.preventDefault();if(!e.value)return toast('Digite seu e-mail',1);const{error}=await sb.auth.resetPasswordForEmail(e.value.trim(),{redirectTo:location.href.split('#')[0]});error?toast(error.message,1):toast('Enviamos um link para o seu e-mail')}}
function novaSenha(){document.getElementById('app').innerHTML=`<div class="lg card">${lb()}<h2>Nova senha</h2><input id="n" type="password" placeholder="Nova senha (mín. 8 caracteres)"><button class="p" style="width:100%" id="sv">Salvar</button></div>`;document.getElementById('sv').onclick=async()=>{if(n.value.length<8)return toast('Mínimo de 8 caracteres',1);const{error}=await sb.auth.updateUser({password:n.value});if(error)toast(error.message,1);else{toast('Senha alterada');boot()}}}
